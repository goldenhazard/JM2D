[pytest]
testpaths = tests
pythonpath = .
markers =
    gpu: needs a CUDA GPU and the checkpoints (skipped without them; error with JM2D_REQUIRE_GOLDEN=1)
    ckpt: needs the checkpoint files (skipped without them; error with JM2D_REQUIRE_GOLDEN=1)
filterwarnings =
    ignore::FutureWarning
    ignore::DeprecationWarning
