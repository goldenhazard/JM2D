# JM2D ("Ours"): joint model-based / model-free sampling (diffuser/models/jm2d.py).
# Legacy: SafeRobomimic@origin/um_dpcc (a71ff97a), variant 'model_based-dpcc-c-tightened'
# (scripts/eval_dev.py / eval_dev_Kfunc.py).
planner: jm2d
legacy_variant: model_based-dpcc-c-tightened
batch_size: 4                       # origin/um_dpcc config/avoiding-d3il.py plan.batch_size
constraint_padding: 0.01            # um_dpcc config generator: enlarge_constraints = 0.01 for model_based variants
dynamics_constraints: true          # the um_dpcc runner builds constraints with action_dim = 2 (dynamics rows included)
trajectory_selection: minimum_projection_cost
diffusion_timestep_threshold: 1.0
num_mc_samples: 100                 # N clean samples per plan (was N_sample_action)
temperature: 0.05                   # (was temp_mppi); penalty coefficient 1000 is fixed in JM2DSampler.optimize
u_steps: full                       # clean-sample estimate: 'full' = full denoising (Table 2); 0, 1, 2, 5, 10 for Table 3
